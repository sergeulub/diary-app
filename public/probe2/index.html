<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Проба 2">
<link rel="manifest" href="/diary-app/probe2/manifest.webmanifest">
<link rel="apple-touch-icon" href="/diary-app/apple-touch-icon-180x180.png">
<title>Проба 2</title>
<style>
  body { margin: 0; padding: max(28px, env(safe-area-inset-top)) 20px 20px; background: #E3DDC8; color: #252920;
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  h1 { font-size: 26px; margin: 0 0 16px; }
  .row { padding: 12px 0; border-bottom: 1px solid #CFC9B4; }
  b { display: block; font-size: 13px; color: #666A57; font-weight: 600; }
</style>
</head>
<body>
<h1>Проба 2: изоляция</h1>
<div class="row"><b>Где открыта эта страница</b><span id="mode">…</span></div>
<div class="row"><b>Отметка «Дневника» (localStorage)</b><span id="marker">…</span></div>
<div class="row"><b>Базы IndexedDB, видимые отсюда</b><span id="dbs">…</span></div>
<div class="row"><b>Вывод</b><span id="verdict">…</span></div>
<script type="module">
  import { isolationVerdict } from './verdict.js'

  const selfStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
  document.getElementById('mode').textContent = selfStandalone ? 'приложение с экрана «Домой»' : 'вкладка Safari'

  let markerRaw = null
  try { markerRaw = localStorage.getItem('diary-probe-marker') } catch (e) {}
  let markerText = 'нет'
  if (markerRaw) {
    try {
      const m = JSON.parse(markerRaw)
      markerText = new Date(m.at).toLocaleString('ru-RU') + (m.standalone ? ' — из установленного «Дневника»' : ' — из вкладки Safari')
    } catch (e) {
      markerText = markerRaw + ' — источник неизвестен'
    }
  }
  document.getElementById('marker').textContent = markerText

  try {
    const names = (await indexedDB.databases()).map((d) => d.name)
    document.getElementById('dbs').textContent = names.length ? names.join(', ') : 'нет'
  } catch (e) {
    document.getElementById('dbs').textContent = 'список недоступен'
  }

  document.getElementById('verdict').textContent = isolationVerdict({ selfStandalone, markerRaw }).text
</script>
</body>
</html>
